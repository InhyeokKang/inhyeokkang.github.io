main:
  - name: LocalFileAI
    category: 팀 사이드 프로젝트
    status: 데스크톱 앱
    overview: 기억나는 문서 내용으로 로컬 파일을 검색하고, 로컬 LLM으로 파일명과 폴더 정리 방법을 제안하는 앱을 팀원들과 개발했습니다.
    contribution:
      - "사용자가 수정한 파일명이 실제 정리 요청에 반영되도록 화면 입력과 API 전달 과정을 수정했습니다."
      - "적용 전 검사 결과, 작업 이력, 되돌리기 기능을 화면과 연결하고 GitHub PR로 변경사항을 통합했습니다."
    technologies: [React, Electron, FastAPI, Ollama, ChromaDB, Git/GitHub]
    links:
      - label: 소개 페이지
        url: https://localfileai.github.io/localfile-ai/
      - label: GitHub
        url: https://github.com/localfileai/localfile-ai
  - name: Fitbalance
    category: 2026 국민체육진흥공단 공공데이터 활용 경진대회
    status: 공모전 참여
    overview: 국민체력100과 체육시설 공공데이터를 활용해 체력을 비교하고, 생활 시간과 이동 거리에 맞는 운동 강좌·시설을 추천하는 앱을 개발했습니다.
    contribution:
      - "Android 앱과 백엔드 개발을 맡아 사용자 입력부터 체력 분석·강좌 추천까지 연결했습니다."
      - "비교 차트와 추천 카드를 구성하고, 장소 선택·시간 입력 과정의 화면 오류를 수정했습니다."
    technologies: [Kotlin, Jetpack Compose, FastAPI, 공공 API, Git/GitHub]
    links:
      - label: 웹 미리보기
        url: http://fitbalance.o-r.kr/
      - label: GitHub
        url: https://github.com/InhyeokKang/fitbalance
  - name: 물증
    category: 2026 ICT 표준 챌린지 공모전
    status: 1차 합격
    success: true
    overview: 양식장 상태와 경보를 확인하고, 대응 조치와 결과를 기록해 사고 증빙 자료를 정리하는 앱을 팀원들과 개발했습니다.
    contribution:
      - "팀 공동 개발에 참여했습니다. TTA 표준을 바탕으로 관측 데이터 재생·모의 장치를 활용하는 프로토타입을 구성했습니다."
      - "팀 결과물은 상태를 쉬운 문구와 색상으로 표시하고, 조치 버튼과 처리 완료·기록 확인 화면을 연결했습니다."
    technologies: [Kotlin, Jetpack Compose, Python, SQLite, TTA 표준]
    note: 2026년 11월 2차 발표 예정 · 2026.10.13 기준
